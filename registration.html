<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetCare Registration</title>
<link rel="stylesheet" href="petcare.css">
</head>

<body>

<header>
<nav>
<h1 class="logo">PetCare</h1>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="registration.html">Register</a></li>
</ul>

</nav>
</header>

<section class="section">

<h2 class="section-title">Pet Adoption Registration</h2>

<div class="contact-container">

<form class="contact-form" id="registerForm">

<input type="text"
id="name"
placeholder="Full Name"
required>

<input type="email"
id="email"
placeholder="Email"
required>

<input type="password"
id="password"
placeholder="Password"
minlength="6"
required>

<input type="date"
id="dob"
required>

<input type="tel"
id="phone"
placeholder="Phone Number"
pattern="[0-9]{10}"
maxlength="10"
required>

<select id="pet" required>

<option value="">Select Pet</option>
<option>Dog</option>
<option>Cat</option>
<option>Rabbit</option>
<option>Bird</option>

</select>

<input type="file"
id="photo"
accept=".jpg,.jpeg,.png"
required>

<textarea
id="address"
rows="4"
placeholder="Address"
required></textarea>

<button type="button" onclick="registerUser()">Register</button>

</form>

</div>

<h2 class="section-title">Registration Details</h2>

<div id="result"></div>

</section>

<footer>
<p>© 2026 PetCare. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
